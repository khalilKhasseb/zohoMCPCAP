[project]
name = "zoho-campaigns-mcp"
version = "0.1.0"
description = "MCP server for Zoho Campaigns — manage campaigns, contacts, and mailing lists"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
zoho-campaigns-mcp = "zoho_campaigns_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoho_campaigns_mcp"]

[tool.uv]
dev-dependencies = []
